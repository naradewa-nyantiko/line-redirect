<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body>
  <p>読み込み中...</p>
  <script>
    const LIFF_ID = 'ここにLIFF IDを入れる';
    const GAS_URL = 'ここにデプロイURLを入れる';
    
    liff.init({liffId: LIFF_ID}).then(async () => {
      const profile = await liff.getProfile();
      const lineId = profile.userId;
      window.location.href = GAS_URL + '?lineId=' + lineId;
    }).catch(err => {
      document.body.innerHTML = 'エラー: ' + err.message;
    });
  </script>
</body>
</html>
