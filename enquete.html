<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbykEzdwVU4Cbl4aRdw1-6JF3xE80fdCO-JdHjU_ABMBBooh_KUBjYRzC6W-jQC9SCBU/exec';

// URLからLINE IDを取得
const urlParams = new URLSearchParams(window.location.search);
const lineId = urlParams.get('lineId');

async function submitEnquete() {
  const gift1 = document.querySelector('input[name="gift1"]:checked');
  const gift2 = document.querySelector('input[name="gift2"]:checked');
  const gift3 = document.querySelector('input[name="gift3"]:checked');

  if (!gift1 || !gift2 || !gift3) {
    alert('プレゼント希望を全て選んでください');
    return;
  }

  const q1 = document.getElementById('q1').value;
  const q2 = document.getElementById('q2').value;
  const q3 = document.getElementById('q3').value;

  await fetch(GAS_URL + '?action=enquete&lineId=' + lineId +
    '&gift1=' + encodeURIComponent(gift1.value) +
    '&gift2=' + encodeURIComponent(gift2.value) +
    '&gift3=' + encodeURIComponent(gift3.value) +
    '&q1=' + encodeURIComponent(q1) +
    '&q2=' + encodeURIComponent(q2) +
    '&q3=' + encodeURIComponent(q3));

  alert('送信完了しました！ありがとうございました😊');
  window.close();
}
</script>
